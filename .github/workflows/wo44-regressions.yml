name: WO44 baseline and correction
on:
  push:
    branches: [wo44/pr302-critical-review]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, correction]
        backend: [rocksdb, sqlite]
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '1'
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select production source and identical regressions
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.source }}' == baseline ]]; then
            git worktree add --detach ../wo44-baseline 1ff0db7dd4839ea30a0aa7d76c59f1f11d45de5e
            for path in light-client-lib/src/tests/utils/mod.rs light-client-lib/src/tests/protocols/block_filter.rs light-client-lib/src/storage/canonical/recovery_tests.rs light-client-lib/src/storage/canonical/wo44_tests.rs light-client-lib/src/protocols/light_client/peers/recovery_tests.rs light-client-lib/src/protocols/light_client/peers/wo44_tests.rs; do
              cp "$path" "../wo44-baseline/$path"
            done
            echo "WO44_SOURCE=$GITHUB_WORKSPACE/../wo44-baseline" >> "$GITHUB_ENV"
          else
            echo "WO44_SOURCE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - name: Install pinned toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Run real-backend regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          cd "$WO44_SOURCE"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/evidence/source.txt"
          git diff --binary > "$GITHUB_WORKSPACE/evidence/test-overlay.patch"
          flags=()
          if [[ '${{ matrix.backend }}' == sqlite ]]; then flags+=(--features sqlite); fi
          set +e
          cargo +1.95.0 test --locked -p ckb-light-client-lib --lib "${flags[@]}" wo44_ -- --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/evidence/regressions.log"
          result=${PIPESTATUS[0]}
          set -e
          echo "$result" > "$GITHUB_WORKSPACE/evidence/exit-code.txt"
          if [[ '${{ matrix.source }}' == baseline ]]; then
            test "$result" = 101
            grep -q 'test result: FAILED' "$GITHUB_WORKSPACE/evidence/regressions.log"
          else
            test "$result" = 0
          fi
      - name: Upgrade a pristine WO29 historical-writer database and reopen
        if: matrix.source == 'correction'
        shell: bash
        run: |
          set -euo pipefail
          backend='${{ matrix.backend }}'
          fixture="light-client-lib/tests/fixtures/wo29/$backend-pristine.zip"
          if [[ "$backend" == rocksdb ]]; then
            expected=fcf1d192e890b474f630774e0188dcd1f5dd2c4cf9c55fa175d6a806d08ffcbd
          else
            expected=1a95c27610aa2fa71e79d5d6ba046fcb4ff2a2d6cbe3078c405dac4b5342b65f
          fi
          echo "$expected  $fixture" | sha256sum --check | tee evidence/fixture-hash.log
          mkdir "$RUNNER_TEMP/wo44-legacy"
          unzip -q "$fixture" -d "$RUNNER_TEMP/wo44-legacy"
          export WO29_LEGACY_DB="$RUNNER_TEMP/wo44-legacy"
          flags=()
          if [[ "$backend" == sqlite ]]; then
            flags+=(--features sqlite)
            export WO29_LEGACY_DB="$WO29_LEGACY_DB/positional-release-physical-upgrades-sqlite"
          fi
          cargo +1.95.0 test --locked -p ckb-light-client-lib --test canonical_status "${flags[@]}" recovery_upgrade_physical_legacy_wallet -- --ignored --exact --nocapture 2>&1 | tee evidence/historical-upgrade.log
      - name: Install existing nextest runner
        if: matrix.source == 'correction'
        uses: taiki-e/install-action@nextest
      - name: Reuse focused target for all library and integration tests
        if: matrix.source == 'correction'
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ '${{ matrix.backend }}' == sqlite ]]; then flags+=(--features sqlite); fi
          cargo +1.95.0 nextest run --locked -p ckb-light-client-lib "${flags[@]}" --no-fail-fast --test-threads 4 --success-output immediate --failure-output immediate 2>&1 | tee evidence/full-library.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wo44-${{ matrix.source }}-${{ matrix.backend }}
          path: evidence/
